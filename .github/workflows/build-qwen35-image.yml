name: Build Qwen3.5 runtime image

on:
  push:
    branches:
      - build/qwen35-image
    paths:
      - .github/workflows/build-qwen35-image.yml
      - qwen35/environment/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qwen35-runtime-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jinyuanli0012/rzero-qwen35

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out image source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: qwen35/environment/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:verl-0.8.0
            ${{ env.IMAGE_NAME }}:commit-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=qwen35-runtime
          cache-to: type=gha,mode=max,scope=qwen35-runtime
