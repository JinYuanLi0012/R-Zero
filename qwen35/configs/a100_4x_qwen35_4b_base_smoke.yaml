{
  "schema_version": 1,
  "profile": "smoke",
  "model": {
    "id": "Qwen/Qwen3.5-4B-Base",
    "revision": "1001bb4",
    "trust_remote_code": false,
    "language_model_only": true
  },
  "runtime": {
    "python": "3.12",
    "cuda": "12.8",
    "verl_ref": "v0.8.0",
    "training_backend": "fsdp2",
    "rollout_backend": "vllm"
  },
  "hardware": {
    "gpus": [0, 1, 2, 3],
    "questioner_training_gpus": [0, 1],
    "questioner_solver_gpus": [2, 3],
    "solver_training_gpus": [0, 1, 2, 3],
    "solver_service_ports": [5000, 5001]
  },
  "algorithm": {
    "rounds": 1,
    "seed": 1,
    "kl_coef": 0.01,
    "learning_rate": 0.000001,
    "questioner_steps": 1,
    "solver_steps": 1,
    "questioner_rollouts": 4,
    "solver_rollouts": 5,
    "questioner_prompt_batch_size": 4,
    "solver_prompt_batch_size": 4,
    "questioner_update_batch_size": 16,
    "solver_update_batch_size": 8,
    "questioner_solver_samples": 2,
    "candidate_vote_samples": 2,
    "difficulty_min": 0.0,
    "difficulty_max": 1.0,
    "bleu_distance_threshold": 0.5
  },
  "data": {
    "seed_dataset": "hiyouga/math12k",
    "seed_train_split": "train[:16]",
    "seed_val_split": "test[:8]",
    "max_prompt_length": 2048,
    "max_response_length": 512
  },
  "generation": {
    "shards": 4,
    "samples_per_shard": 2,
    "temperature": 1.0,
    "top_p": 0.95,
    "max_tokens": 512
  },
  "curation": {
    "allow_smoke_fallback": true
  },
  "checkpoint": {
    "save_freq": 1,
    "keep": 2,
    "resume_mode": "auto"
  },
  "benchmark": {
    "enabled": false
  },
  "publishing": {
    "enabled": false,
    "repo_id": ""
  }
}
